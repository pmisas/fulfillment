server:
  port: 8082

warehouse:
  service:
    base-url: "http://localhost:8081"

aws:
  region: us-east-1
  dynamodb:
    endpoint: "http://localhost:8000"
    inventory-table: InventoryItems

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
