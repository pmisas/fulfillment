server:
  port: 8082

warehouse:
  service:
    base-url: ${WAREHOUSE_BASE_URL}

aws:
  region: ${AWS_REGION}
  dynamodb:
    inventory-table: ${INVENTORY_TABLE_NAME}
    reservation-table: ${RESERVATION_TABLE_NAME}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
