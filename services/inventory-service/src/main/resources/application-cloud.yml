server:
  port: 8082

warehouse:
  service:
    base-url: ${WAREHOUSE_BASE_URL}

aws:
  region: ${AWS_REGION}
  dynamodb:
    inventory-table: ${INVENTORY_TABLE_NAME}
    reservation-table: ${RESERVATION_TABLE_NAME}
    warehouse-access-table: ${WAREHOUSE_ACCESS_TABLE_NAME}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

springdoc:
  api-docs:
    version: OPENAPI_3_0
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
